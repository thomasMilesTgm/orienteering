[package]
name = "orienteering_terrain"
description = "Deterministic, coarse-to-fine terrain generation: provinces, chunks and their quadtrees."
version.workspace = true
edition.workspace = true

[features]
serde = [
  "dep:serde",
  "nalgebra/serde-serialize",
  "orienteering_math/serde",
  "orienteering_field/serde",
]

[dependencies]
nalgebra.workspace = true
orienteering_field.workspace = true
orienteering_math.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
approx.workspace = true
